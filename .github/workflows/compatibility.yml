name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libmagic ssdeep lld
          echo "CPPFLAGS=-I$(brew --prefix ssdeep)/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix ssdeep)/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install python-magic-bin
      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Fetch pinned integration fixtures
        shell: bash
        run: |
          git clone --depth 1 https://github.com/seifreed/r2inspect-test-binaries.git test-binaries
          git -C test-binaries fetch --depth 1 origin 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          git -C test-binaries checkout --detach 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          mkdir -p samples/fixtures
          find test-binaries -type f \( -name hello_pe.exe -o -name hello_elf -o -name hello_macho -o -name hello_macho_stripped -o -name edge_bad_pe.bin -o -name edge_high_entropy.bin -o -name edge_packed.bin -o -name edge_tiny.bin \) -exec cp {} samples/fixtures/ \;
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m pip install \
            "pytest>=9.0.3" \
            "pytest-timeout>=2.0.0" \
            "coverage>=7.0.0" \
            "yara-python>=4.5.0" \
            "pefile>=2023.2.7" \
            "pybloom-live>=4.0.0" \
            "simhash>=2.1.0"
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Run unit and integration smoke tests
        shell: bash
        run: |
          marker="not slow and not requires_posix"
          # Keep this matrix focused on the installed wheel contract. The full
          # analyzer suite, including optional native hash libraries, runs in CI.
          python -m pytest \
            tests/unit/product \
            tests/unit/test_result_semantics.py \
            tests/unit/test_report_builder.py \
            tests/unit/test_benchmark_reports.py \
            tests/unit/test_differential_tools.py \
            tests/unit/test_backends_consensus.py \
            -m "$marker" -k "not impfuzzy and not telfhash" --timeout=180
          if [ "$RUNNER_OS" != "Windows" ]; then
            python -m pytest tests/integration/test_integration_edge_cases.py -m requires_r2 --timeout=180
          fi
      - name: Verify installed CLI
        run: r2inspect --help
