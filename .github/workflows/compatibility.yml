name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libmagic ssdeep lld
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install python-magic-bin
      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Fetch pinned integration fixtures
        shell: bash
        run: |
          git clone --depth 1 https://github.com/seifreed/r2inspect-test-binaries.git test-binaries
          git -C test-binaries fetch --depth 1 origin 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          git -C test-binaries checkout --detach 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          mkdir -p samples/fixtures
          find test-binaries -type f \( -name hello_pe.exe -o -name hello_elf -o -name hello_macho -o -name hello_macho_stripped -o -name edge_bad_pe.bin -o -name edge_high_entropy.bin -o -name edge_packed.bin -o -name edge_tiny.bin \) -exec cp {} samples/fixtures/ \;
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Run unit and integration smoke tests
        shell: bash
        run: |
          marker="not slow and not requires_posix"
          python -m pytest tests/unit -m "$marker" --timeout=180
          python -m pytest tests/integration/test_integration_edge_cases.py -m requires_r2 --timeout=180
      - name: Verify installed CLI
        run: r2inspect --help
