name: Benchmark

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      require_real_corpus:
        description: "Require release-sized private holdout corpora"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      require_real_corpus:
        description: "Require release-sized private holdout corpora"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  public-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld
      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Fetch pinned public corpus
        run: |
          git clone --depth 1 https://github.com/seifreed/r2inspect-test-binaries.git test-binaries
          git -C test-binaries fetch --depth 1 origin 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          git -C test-binaries checkout --detach 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          test "$(git -C test-binaries rev-parse HEAD)" = "1d8a0ac76d92dfd68587ba30b1c987b78b59009a"
      - name: Run corpus and score reports
        run: |
          python benchmarks/run_corpus.py benchmarks/public_corpus.json \
            --corpus-dir test-binaries --output-dir benchmark-results
          python benchmarks/evaluate_reports.py benchmark-results/manifest.json \
            --output benchmark-results/metrics.json \
            --min-precision 1.0 --min-recall 1.0 \
            --max-execution-failure-rate 0.01 \
            --max-dependency-unavailable-rate 0.0
      - name: Run expanded real public corpus
        run: |
          python benchmarks/real_public_corpus.py expanded-real-public-corpus
          python benchmarks/run_corpus.py \
            expanded-real-public-corpus/manifest.json \
            --corpus-dir expanded-real-public-corpus \
            --output-dir expanded-real-public-results --profile fast
          python benchmarks/evaluate_reports.py \
            expanded-real-public-results/manifest.json \
            --output expanded-real-public-results/metrics.json \
            --min-classification-precision 1.0 \
            --min-classification-recall 0.5 \
            --max-execution-failure-rate 0.01 \
            --max-dependency-unavailable-rate 0.0
          python benchmarks/run_corpus.py \
            expanded-real-public-corpus/manifest.json \
            --corpus-dir expanded-real-public-corpus \
            --output-dir expanded-real-clustering-results --profile standard
          python benchmarks/calibrate_clustering.py \
            expanded-real-clustering-results/manifest.json \
            --output expanded-real-clustering-results/clustering.json
      - name: Restore and update benchmark history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow benchmark.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name "r2inspect-benchmark-$previous_run" --dir previous || true
            history="$(find previous -name history.json -print -quit)"
            if [ -n "$history" ]; then cp "$history" benchmark-results/history.json; fi
          fi
          python benchmarks/benchmark_history.py \
            --history benchmark-results/history.json \
            --dashboard benchmark-results/dashboard.md \
            --metric public=benchmark-results/metrics.json \
            --metric real_public=expanded-real-public-results/metrics.json \
            --clustering expanded-real-clustering-results/clustering.json \
            --run-id "${{ github.run_id }}" --commit "${{ github.sha }}"
          cat benchmark-results/dashboard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2inspect-benchmark-${{ github.run_id }}
          path: |
            benchmark-results/
            expanded-real-public-results/
            expanded-real-clustering-results/

  private-corpus:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Check private corpus configuration
        id: config
        env:
          CORPUS_URL: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_URL }}
          CORPUS_TOKEN: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_TOKEN }}
          CORPUS_SHA256: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_SHA256 }}
        run: |
          if [ -n "$CORPUS_URL" ] && [ -n "$CORPUS_TOKEN" ] && [ -n "$CORPUS_SHA256" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.13"
      - name: Install system dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld
      - name: Install radare2
        if: steps.config.outputs.enabled == 'true'
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Install package
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Fetch private corpus archive
        if: steps.config.outputs.enabled == 'true'
        env:
          CORPUS_URL: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_URL }}
          CORPUS_TOKEN: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_TOKEN }}
          CORPUS_SHA256: ${{ secrets.R2INSPECT_PRIVATE_CORPUS_SHA256 }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $CORPUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$CORPUS_URL" --output private-corpus.tar
          echo "$CORPUS_SHA256  private-corpus.tar" | sha256sum --check
          mkdir private-corpus
          tar -xf private-corpus.tar --strip-components=1 --directory private-corpus
      - name: Run and score private corpus
        if: steps.config.outputs.enabled == 'true'
        run: |
          python benchmarks/run_corpus.py private-corpus/benchmark/manifest.json \
            --corpus-dir private-corpus --output-dir private-benchmark-results
          python benchmarks/evaluate_reports.py private-benchmark-results/manifest.json \
            --output private-benchmark-results/metrics.json \
            --min-precision 0.9 --min-recall 0.9 \
            --max-execution-failure-rate 0.01 \
            --max-dependency-unavailable-rate 0.0
      - name: Publish aggregate private metrics
        if: always() && steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r2inspect-private-benchmark-${{ github.run_id }}
          path: private-benchmark-results/metrics.json

  real-corpus-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      source: ${{ steps.config.outputs.source }}
    steps:
      - id: config
        env:
          CORPUS_URL: ${{ secrets.R2INSPECT_REAL_CORPUS_URL }}
          CORPUS_TOKEN: ${{ secrets.R2INSPECT_REAL_CORPUS_TOKEN }}
          CORPUS_SHA256: ${{ secrets.R2INSPECT_REAL_CORPUS_SHA256 }}
          A1000_TOKEN: ${{ secrets.A1000_TOKEN }}
        run: |
          if [ -n "$A1000_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "source=a1000" >> "$GITHUB_OUTPUT"
          elif [ -n "$CORPUS_URL" ] && [ -n "$CORPUS_TOKEN" ] && [ -n "$CORPUS_SHA256" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "source=archive" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

  real-labeled-corpus:
    needs: real-corpus-config
    if: needs.real-corpus-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld
      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Install specialist differential tools
        if: needs.real-corpus-config.outputs.source != 'a1000'
        run: python -m pip install flare-capa floss
      - name: Fetch licensed real corpus archive
        if: needs.real-corpus-config.outputs.source == 'archive'
        env:
          CORPUS_URL: ${{ secrets.R2INSPECT_REAL_CORPUS_URL }}
          CORPUS_TOKEN: ${{ secrets.R2INSPECT_REAL_CORPUS_TOKEN }}
          CORPUS_SHA256: ${{ secrets.R2INSPECT_REAL_CORPUS_SHA256 }}
        run: |
          curl --fail --location --retry 3 -H "Authorization: Bearer $CORPUS_TOKEN" "$CORPUS_URL" --output real-corpus.tar
          echo "$CORPUS_SHA256  real-corpus.tar" | sha256sum --check
          mkdir real-corpus
          tar -xf real-corpus.tar --strip-components=1 --directory real-corpus
          test "$(python -c 'import json; print(json.load(open("real-corpus/benchmark/manifest.json"))["corpus_kind"])')" = real_labeled
          test "$(python -c 'import json; print(len(json.load(open("real-corpus/benchmark/manifest.json"))["cases"]))')" -ge 10
      - name: Materialize pinned A1000 corpus
        if: needs.real-corpus-config.outputs.source == 'a1000'
        env:
          A1000_HOST: ${{ secrets.A1000_HOST || 'https://a1000.reversinglabs.com' }}
          A1000_TOKEN: ${{ secrets.A1000_TOKEN }}
        run: |
          python benchmarks/materialize_a1000_corpus.py \
            benchmarks/a1000_release_manifest.json \
            --output-dir real-corpus
      - name: Run and score real labeled corpus
        run: |
          release_args=()
          quality_args=()
          differential_args=()
          finding_args=(
            --max-execution-failure-rate 0.01
            --max-dependency-unavailable-rate 0.0
          )
          if [ "${{ needs.real-corpus-config.outputs.source }}" != "a1000" ]; then
            differential_args+=(--differential-tool capa --differential-tool floss)
          fi
          if [ "${{ inputs.require_real_corpus }}" = "true" ]; then
            release_args+=(--release-gate)
            quality_args+=(
              --min-classification-precision 0.9
              --min-classification-recall 0.9
              --min-evidence-coverage 1.0
              --min-high-severity-location-rate 0.95
            )
            if [ "${{ needs.real-corpus-config.outputs.source }}" != "a1000" ]; then
              quality_args+=(--max-high-severity-false-positive-rate 0.01)
              finding_args+=(--min-precision 0.9 --min-recall 0.9)
            fi
          fi
          python benchmarks/run_corpus.py real-corpus/benchmark/manifest.json \
            --corpus-dir real-corpus --output-dir real-benchmark-results \
            "${differential_args[@]}" \
            "${release_args[@]}"
          python benchmarks/calibrate_classification.py \
            real-benchmark-results/manifest.json \
            --output real-benchmark-results/classification-calibration.json
          python benchmarks/evaluate_reports.py real-benchmark-results/manifest.json \
            --output real-benchmark-results/metrics.json \
            "${finding_args[@]}" \
            "${quality_args[@]}"
      - name: Publish aggregate real metrics
        uses: actions/upload-artifact@v4
        with:
          name: r2inspect-real-benchmark-${{ github.run_id }}
          path: |
            real-benchmark-results/metrics.json
            real-benchmark-results/classification-calibration.json

  release-corpus-gate:
    needs: [public-corpus, private-corpus, real-corpus-config, real-labeled-corpus]
    if: always() && inputs.require_real_corpus
    runs-on: ubuntu-latest
    steps:
      - name: Require release evidence
        env:
          PUBLIC_RESULT: ${{ needs.public-corpus.result }}
          PRIVATE_ENABLED: ${{ needs.private-corpus.outputs.enabled }}
          PRIVATE_RESULT: ${{ needs.private-corpus.result }}
          REAL_ENABLED: ${{ needs.real-corpus-config.outputs.enabled }}
          REAL_RESULT: ${{ needs.real-labeled-corpus.result }}
        run: |
          test "$PUBLIC_RESULT" = success
          test "$PRIVATE_ENABLED" = true
          test "$PRIVATE_RESULT" = success
          test "$REAL_ENABLED" = true
          test "$REAL_RESULT" = success
