name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.target.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            platform: linux-x64
            expected_arch: x86_64
          - os: macos-14
            platform: macos-arm64
            expected_arch: arm64
        python-version: ["3.13", "3.14"]
        include:
          - target:
              os: windows-latest
              platform: windows-x64
              expected_arch: x86_64
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate runner architecture (Unix)
        if: runner.os != 'Windows'
        run: |
          arch="$(uname -m)"
          echo "Detected architecture: $arch"
          if [ "$arch" != "${{ matrix.target.expected_arch }}" ]; then
            echo "Unexpected architecture for ${{ matrix.target.platform }}: expected ${{ matrix.target.expected_arch }}, got $arch"
            exit 1
          fi

      - name: Validate runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ([Environment]::Is64BitOperatingSystem) { "x86_64" } else { "x86" }
          Write-Host "Detected architecture: $arch"
          if ($arch -ne "${{ matrix.target.expected_arch }}") {
            throw "Unexpected architecture for ${{ matrix.target.platform }}: expected ${{ matrix.target.expected_arch }}, got $arch"
          }

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev ssdeep libfuzzy-dev lld

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libmagic ssdeep lld
          # Expose Homebrew's ssdeep headers/libs so pyimpfuzzy's impfuzzyutil
          # C extension (which #includes <fuzzy.h>) compiles; Homebrew does not
          # put them on clang's default search path.
          echo "CPPFLAGS=-I$(brew --prefix ssdeep)/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix ssdeep)/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"

      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: '6.1.8'

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipUrl = "https://github.com/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1-win32-binary.zip"
          $zipPath = "$env:RUNNER_TEMP\ssdeep-win32.zip"
          $extractRoot = "$env:RUNNER_TEMP\ssdeep"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $binDir = Join-Path $extractRoot "ssdeep-2.14.1"
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$binDir\ssdeep.exe" -V
          pip install python-magic-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]


      - name: Fetch test binaries
        shell: bash
        run: |
          git init test-binaries
          git -C test-binaries remote add origin https://github.com/seifreed/r2inspect-test-binaries.git
          git -C test-binaries fetch --depth 1 origin 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          git -C test-binaries checkout --detach FETCH_HEAD
          test "$(git -C test-binaries rev-parse HEAD)" = "1d8a0ac76d92dfd68587ba30b1c987b78b59009a"
          python - <<'PY'
          from pathlib import Path
          import shutil

          repo = Path("test-binaries")
          dst = Path("samples/fixtures")
          dst.mkdir(parents=True, exist_ok=True)
          required = {
              "hello_pe.exe",
              "hello_elf",
              "hello_macho",
              "hello_macho_stripped",
              "edge_bad_pe.bin",
              "edge_high_entropy.bin",
              "edge_packed.bin",
              "edge_tiny.bin",
          }

          found = {}
          for item in repo.rglob("*"):
              if item.is_file() and item.name in required and item.name not in found:
                  found[item.name] = item

          missing = sorted(required - found.keys())
          if missing:
              raise SystemExit(f"Missing required test binaries: {missing}")

          for name, src in sorted(found.items()):
              shutil.copy2(src, dst / name)
          print(f"Copied {len(found)} fixtures from {repo} to {dst}")
          PY

      - name: Quality gate (format, lint, types, security, audit, policy scans)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/quality_gate.sh

      - name: Test installation (Unix)
        if: runner.os != 'Windows'
        run: |
          pip install -e .
          r2inspect --help
          ssdeep -V

      - name: Test installation (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "import r2inspect, sys; print(r2inspect.__version__)"
          r2 -v
          ssdeep -V

      - name: Run integration tests
        timeout-minutes: 20
        shell: bash
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # r2pipe's Windows child process can leave native reader threads
            # blocked after timeout; the wheel/CLI matrix covers Windows.
            echo "Skipping radare2 batch integration on Windows; covered by compatibility smoke tests."
            exit 0
          fi
          marker="not slow"
          python -c "from pathlib import Path; Path('.coverage-gate').mkdir(parents=True, exist_ok=True)"
          python scripts/ci_run_integration_batch.py --batch 1 --total-batches 1 --threshold 0 --marker "$marker"

      - name: Run unit tests with coverage
        shell: bash
        env:
          R2INSPECT_TEST_MAX_CPU_SECONDS: "900"
          COVERAGE_FILE: .coverage.unit
        run: |
          python - <<'PY'
          import sys

          import pytest

          if sys.platform == "win32":
              args = [
                  "tests/unit/product",
                  "-m",
                  "not slow and not requires_posix",
                  "-k",
                  "not impfuzzy and not telfhash",
              ]
          else:
              args = ["tests/unit", "-m", "not slow"]
          args.extend(["--timeout=180", "--cov=r2inspect", "--cov-report=term-missing"])
          raise SystemExit(pytest.main(args))
          PY

      - name: Export separate and combined coverage
        shell: bash
        run: |
          COVERAGE_FILE=.coverage.integration coverage xml -o coverage-integration.xml
          COVERAGE_FILE=.coverage.unit coverage xml -o coverage-unit.xml
          coverage combine --keep .coverage.integration .coverage.unit
          coverage report --fail-under=98
          coverage xml -o coverage-combined.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: seifreed/r2inspect
          files: ./coverage-unit.xml,./coverage-integration.xml,./coverage-combined.xml
          fail_ci_if_error: true

  test-linux-x86-ssdeep-cli:
    runs-on: ubuntu-latest
    container:
      image: i386/python:3.13-slim
    steps:
      - name: Install ssdeep on linux/386
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ssdeep

      - name: Validate ssdeep CLI on linux/386
        run: |
          ssdeep -V
          ssdeep -s /etc/hosts

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check documentation links
        run: python scripts/check_docs_links.py
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  smoke-distributions:
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        package: ["*.whl", "*.tar.gz"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install and run distribution
        shell: bash
        run: |
          artifact="$(find dist -type f -name '${{ matrix.package }}' -print -quit)"
          test -n "$artifact"
          python -m pip install "$artifact"
          r2inspect --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch pinned test binaries
        shell: bash
        run: |
          git init test-binaries
          git -C test-binaries remote add origin https://github.com/seifreed/r2inspect-test-binaries.git
          git -C test-binaries fetch --depth 1 origin 1d8a0ac76d92dfd68587ba30b1c987b78b59009a
          git -C test-binaries checkout --detach FETCH_HEAD
          test "$(git -C test-binaries rev-parse HEAD)" = "1d8a0ac76d92dfd68587ba30b1c987b78b59009a"
          mkdir -p samples/fixtures
          find test-binaries -type f \( \
            -name hello_pe.exe -o \
            -name hello_elf -o \
            -name hello_macho \
          \) -exec cp {} samples/fixtures/ \;

      - name: Build container
        run: docker build --provenance=false --iidfile /tmp/image-a --tag r2inspect:test .

      - name: Verify reproducible image digest
        run: |
          docker build --provenance=false --iidfile /tmp/image-b --tag r2inspect:repeat .
          cmp /tmp/image-a /tmp/image-b

      - name: Verify pinned radare2
        shell: bash
        run: |
          version="$(docker run --rm --entrypoint r2 r2inspect:test -v)"
          grep -F "radare2 6.1.8" <<<"$version"
          grep -F "commit: d904d02e1157b45135c6e61651d890bac8abe873" <<<"$version"

      - name: Verify minimal unprivileged runtime
        run: |
          docker run --rm --entrypoint python r2inspect:test -c \
            "import os, shutil; assert os.getuid() == os.getgid() == 10001; assert not any(shutil.which(x) for x in ('gcc', 'git', 'make'))"

      - name: Smoke test PE, ELF, and Mach-O
        shell: bash
        run: |
          for sample in hello_pe.exe hello_elf hello_macho; do
            docker run --rm \
              --volume "$PWD/samples/fixtures:/samples:ro" \
              r2inspect:test --json "/samples/$sample" >/dev/null
          done

      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: r2inspect:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
