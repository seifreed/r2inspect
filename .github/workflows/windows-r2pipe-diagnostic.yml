name: Windows r2pipe diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-r2pipe-diagnostic.yml

permissions:
  contents: read

jobs:
  framing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install radare2
        uses: radareorg/github-actions@v2
        with:
          version: "6.1.8"
      - name: Capture raw pipe framing
        shell: bash
        run: |
          python - <<'PY'
          import ctypes
          import msvcrt
          import shutil
          import subprocess
          import sys
          import time

          executable = shutil.which("radare2") or shutil.which("r2")
          print(f"executable={executable}")
          process = subprocess.Popen(
              [executable, "-q0", sys.executable],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              bufsize=0,
          )
          handle = msvcrt.get_osfhandle(process.stdout.fileno())

          def collect(label: str, seconds: float) -> None:
              deadline = time.monotonic() + seconds
              chunks = []
              while time.monotonic() < deadline:
                  available = ctypes.c_ulong()
                  ok = ctypes.windll.kernel32.PeekNamedPipe(
                      ctypes.c_void_p(handle), None, 0, None, ctypes.byref(available), None
                  )
                  if not ok:
                      raise ctypes.WinError()
                  if available.value:
                      chunk = process.stdout.read(available.value)
                      chunks.append(chunk)
                      print(f"{label} chunk={chunk.hex()} repr={chunk!r}")
                  time.sleep(0.01)
              print(f"{label} combined={b''.join(chunks)!r}")

          try:
              collect("startup", 2)
              process.stdin.write(b"ij\n")
              process.stdin.flush()
              collect("ij", 3)
              process.stdin.write(b"\n")
              process.stdin.flush()
              collect("blank", 3)
          finally:
              process.terminate()
              process.wait(timeout=5)
          PY
