name: Install radare2
description: Install a pinned radare2 release with retries for transient release-download failures
inputs:
  version:
    description: Radare2 release version without a v prefix
    required: true
runs:
  using: composite
  steps:
    - name: Install radare2 on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        R2_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [[ "$R2_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        arch="$(dpkg --print-architecture)"
        for package in "radare2_${R2_VERSION}_${arch}.deb" "radare2-dev_${R2_VERSION}_${arch}.deb"; do
          for attempt in {1..5}; do
            if gh release download "$R2_VERSION" --repo radareorg/radare2 \
              --pattern "$package" --dir "$RUNNER_TEMP" --clobber; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Failed to download $package after retries" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
        done
        sudo dpkg -i "$RUNNER_TEMP/radare2_${R2_VERSION}_${arch}.deb"
        sudo dpkg -i "$RUNNER_TEMP/radare2-dev_${R2_VERSION}_${arch}.deb"
        r2 -v

    - name: Install radare2 on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        R2_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [[ "$R2_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        case "$(uname -m)" in
          arm64|aarch64) arch=arm64 ;;
          *) arch=x64 ;;
        esac
        pkg="$RUNNER_TEMP/radare2.pkg"
        asset="radare2-${arch}-${R2_VERSION}.pkg"
        for attempt in {1..5}; do
          if gh release download "$R2_VERSION" --repo radareorg/radare2 \
            --pattern "$asset" --dir "$RUNNER_TEMP" --clobber; then
            mv "$RUNNER_TEMP/$asset" "$pkg"
            break
          fi
          if [[ "$attempt" -eq 5 ]]; then
            echo "Failed to download $asset after retries" >&2
            exit 1
          fi
          sleep "$((attempt * 2))"
        done
        sudo installer -pkg "$pkg" -target /
        rm -f "$pkg"
        r2 -v

    - name: Install radare2 on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        R2_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:R2_VERSION -notmatch '^\d+\.\d+\.\d+$') {
          throw "Invalid radare2 version: $env:R2_VERSION"
        }
        $arch = switch ($env:PROCESSOR_ARCHITECTURE) {
          'ARM64' { 'w64-arm64' }
          'x86' { 'w32' }
          default { 'w64' }
        }
        $zip = Join-Path $env:RUNNER_TEMP 'radare2.zip'
        $prefix = Join-Path $env:RUNNER_TEMP 'radare2'
        $asset = "radare2-$env:R2_VERSION-$arch.zip"
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          & gh release download $env:R2_VERSION --repo radareorg/radare2 `
            --pattern $asset --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 5) {
            throw "Failed to download $asset after retries (gh exit $LASTEXITCODE)"
          }
          Start-Sleep -Seconds (2 * $attempt)
        }
        Move-Item -Path (Join-Path $env:RUNNER_TEMP $asset) -Destination $zip -Force
        if (Test-Path $prefix) { Remove-Item -Path $prefix -Recurse -Force }
        Expand-Archive -Path $zip -DestinationPath $prefix -Force
        $subdirs = @(Get-ChildItem -Path $prefix -Directory)
        if ($subdirs.Count -eq 1) {
          Get-ChildItem -Path $subdirs[0].FullName | Move-Item -Destination $prefix -Force
          Remove-Item -Path $subdirs[0].FullName -Recurse -Force
        }
        $bin = Join-Path $prefix 'bin'
        if (-not (Test-Path (Join-Path $bin 'radare2.exe'))) {
          throw 'Downloaded radare2 package does not contain bin/radare2.exe'
        }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & (Join-Path $bin 'radare2.exe') -v
